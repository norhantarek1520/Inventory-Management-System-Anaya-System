services:
  mongodb:
    image: mongo:latest
    container_name: ims_mongo_dev
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: supersecretpassword
      MONGO_INITDB_DATABASE: nest_db
    volumes:
      - mongo_data:/data/db
    networks:
      - ims_network

  mongo-express:
    image: mongo-express:latest
    container_name: ims_mongo_express
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: supersecretpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:supersecretpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongodb
    networks:
      - ims_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ims_nestjs_api
    ports:
      - '3000:3000'
    environment:
      - MONGO_URI=mongodb://admin:supersecretpassword@mongodb:27017/inventory_management_system?authSource=admin
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - ims_network

volumes:
  mongo_data:
    driver: local

networks:
  ims_network:
    driver: bridge
